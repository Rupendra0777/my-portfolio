name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fronted/package-lock.json

      - uses: actions/configure-pages@v5

      - run: npm ci
        working-directory: fronted

      # Include the custom domain in the published artifact.
      - run: cp CNAME fronted/public/CNAME

      - run: npm run build
        working-directory: fronted

      # Lets React Router routes load when opened directly or refreshed.
      - run: cp fronted/dist/index.html fronted/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: fronted/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4